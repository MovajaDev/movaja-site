<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOVAJÁ | Curadoria Premium</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Navbar -->
  <header class="navbar">
    <a href="#" class="logo-text">MOVAJÁ<span class="logo-shine"></span></a>
    <nav class="nav-links">
      <a href="#catalogo" class="nav-item">Coleção</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <span class="hero-tag">Curadoria Exclusiva 2026</span>
      <h1 class="hero-title">O SEU ESTILO. <br><span class="gold-text">ELEVADO AO MÁXIMO.</span></h1>
      <p class="hero-desc">Acessórios e peças exclusivas selecionadas para os estilos Old Money e Resort.</p>
      <a href="#catalogo" class="cta-button">Explorar Coleção →</a>
    </div>
  </section>

  <!-- Catálogo -->
  <main id="catalogo" class="catalog-section">
    <div class="section-header">
      <h2>Coleções em Destaque</h2>
      <p>Selecione a sua estética preferida</p>
    </div>

    <!-- Filtros -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">Todos os Itens</button>
      <button class="filter-btn" data-filter="old-money">Old Money</button>
      <button class="filter-btn" data-filter="resort">Resort</button>
    </div>

    <!-- Grid de Produtos -->
    <div class="product-grid" id="product-grid"></div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 MOVAJÁ. Todos os direitos reservados.</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
